name: Deploy landing page to Azure Web App - wema-landing-page

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4DA74D7AB4AF4A1AA15FCC362612008B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B0D3F8F2ADC84B81BE4A527BF2FD4BA5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5BDA0D39CEF744F9AFB39FB581C9ACB1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wema-landing-page'
          slot-name: 'Production'
          package: .
